# Amplify Hosting custom headers (customHttp.yml format). scripts/deploy_frontend.py
# replaces __API_ORIGIN__ with the deployed API's origin and ships the result as
# customHttp.yml at the root of each manual deployment, which Amplify applies.
#
# Why not in template.yaml: the API's CORS rule references the Amplify domain, so the
# Amplify app cannot also reference the API URL without a CloudFormation cycle.
customHeaders:
  - pattern: '**'
    headers:
      # Only our own origin and our API. No inline scripts (the theme bootstrap is a
      # file), no third-party scripts, fonts, frames or form targets.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; connect-src 'self' __API_ORIGIN__; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      - key: 'X-Frame-Options'
        value: 'DENY'
