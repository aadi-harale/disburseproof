[project]
name = "disburseproof-backend"
version = "1.0.0"
description = "DisburseProof: a reliability sandbox for benefit-disbursement pipelines (AWS SAM, Python 3.12)."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "N",   # pep8-naming
  "RUF", # ruff-specific
  "T20", # no print() debugging
]
ignore = [
  "RUF001", # the ₹ sign and em dashes in user-facing strings are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Integration scripts report to the terminal on purpose.
"tests/integration/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# Strict where the correctness argument lives; adapters and handlers are checked
# with the default (relaxed) settings because boto3 is untyped without stubs.
files = ["src/domain", "src/processors"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]
addopts = "-q"
