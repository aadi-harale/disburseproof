AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  DisburseProof: a reliability sandbox for benefit-disbursement pipelines.
  Runs a deterministic duplicate-delivery experiment and verifies whether every
  eligible (synthetic) student was paid exactly once. Synthetic data only:
  no real money, bank APIs or personal data.

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9-]{2,12}"
    Description: Environment name used in every resource name (disburseproof-<env>-<purpose>).
  MaxActiveRuns:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 5
    Description: Cost guard for the public API. POST /runs returns 409 when this many runs are active.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64] # Graviton: lower price per GB-second; all dependencies are pure Python
    CodeUri: src/
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        ENV_NAME: !Ref Env
        BATCHES_TABLE: !Ref BatchesTable
        EXPERIMENTS_TABLE: !Ref ExperimentsTable
        RUNS_TABLE: !Ref RunsTable
        LEDGER_TABLE: !Ref LedgerTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        DELIVERIES_TABLE: !Ref DeliveriesTable
        DELIVERIES_QUEUE_URL: !Ref DeliveriesQueue
        DELIVERIES_DLQ_URL: !Ref DeliveriesDeadLetterQueue
        RECEIPTS_BUCKET: !Ref ReceiptsBucket
        MAX_ACTIVE_RUNS: !Ref MaxActiveRuns
        MAX_DRAIN_ITERATIONS: "90"
        POWERTOOLS_METRICS_NAMESPACE: DisburseProof
        POWERTOOLS_LOG_LEVEL: INFO
    Tags:
      project: disburseproof
      env: !Ref Env

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB (on-demand). The ledger is the record; every verdict is recomputed
  # from these tables after a run.
  # ---------------------------------------------------------------------------
  BatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub disburseproof-${Env}-batches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: batch_id, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: entity_type, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: batch_id, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE } # META or ENT#<beneficiary_id>#<installment>
      GlobalSecondaryIndexes:
        - IndexName: gsi_created # sparse: only META rows carry entity_type
          KeySchema:
            - { AttributeName: entity_type, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  ExperimentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub disburseproof-${Env}-experiments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: experiment_id, AttributeType: S }
        - { AttributeName: batch_id, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: experiment_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: gsi_batch
          KeySchema:
            - { AttributeName: batch_id, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub disburseproof-${Env}-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: run_id, AttributeType: S }
        - { AttributeName: entity_type, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: run_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: gsi_created
          KeySchema:
            - { AttributeName: entity_type, KeyType: HASH }
            - { AttributeName: created_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub disburseproof-${Env}-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: run_id, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: run_id, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE } # EFFECT#<effect_id>

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub disburseproof-${Env}-idempotency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: idem_key, AttributeType: S }
      KeySchema:
        - { AttributeName: idem_key, KeyType: HASH } # <run_id>#<scheme>#<beneficiary>#<year>#INST-<n>

  DeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub disburseproof-${Env}-deliveries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: run_id, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: run_id, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE } # DELIVERY#<delivery_id>

  # ---------------------------------------------------------------------------
  # SQS Standard: at-least-once, unordered delivery is the behaviour under test.
  # ---------------------------------------------------------------------------
  DeliveriesDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub disburseproof-${Env}-deliveries-dlq
      MessageRetentionPeriod: 1209600 # 14 days, so a failed run can be investigated
      SqsManagedSseEnabled: true

  DeliveriesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub disburseproof-${Env}-deliveries-queue
      # Must be >= the worker timeout (30 s). Kept at 2x rather than the usual 6x so a
      # message reported as a batch item failure is retried well inside the
      # drain loop's 180 s budget. The event source mapping's MaximumConcurrency
      # prevents the over-invocation throttling the 6x guidance protects against.
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveriesDeadLetterQueue.Arn
        maxReceiveCount: 5

  # ---------------------------------------------------------------------------
  # S3: integrity receipts (receipts/<run_id>.json), private.
  # ---------------------------------------------------------------------------
  ReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub disburseproof-${Env}-receipts-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # ---------------------------------------------------------------------------
  # CloudWatch Logs: one group per concern, with retention, so the evidence
  # drawer can query a run's JSON lines with one filter pattern per group.
  # ---------------------------------------------------------------------------
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /disburseproof/${Env}/worker
      RetentionInDays: !Ref LogRetentionDays

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /disburseproof/${Env}/workflow
      RetentionInDays: !Ref LogRetentionDays

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /disburseproof/${Env}/api
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Worker: one Lambda, processor chosen by the run record.
  # ---------------------------------------------------------------------------
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-worker
      Description: Processes deliveries with the run's processor (vulnerable, protected or naive).
      Handler: handlers.worker.handler
      MemorySize: 512
      LoggingConfig:
        LogFormat: Text # Powertools already writes one JSON object per line
        LogGroup: !Ref WorkerLogGroup
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref LedgerTable }
        - DynamoDBCrudPolicy: { TableName: !Ref IdempotencyTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DeliveriesTable }
      Events:
        Deliveries:
          Type: SQS
          Properties:
            Queue: !GetAtt DeliveriesQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            # Caps concurrent invocations from this queue without reserved concurrency,
            # which new accounts with a low concurrency quota may not be able to set.
            ScalingConfig:
              MaximumConcurrency: 5

  # ---------------------------------------------------------------------------
  # Step Functions task functions.
  # ---------------------------------------------------------------------------
  InitRunFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-init-run
      Handler: handlers.workflow.init_run.handler
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref WorkflowLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BatchesTable }

  InjectPhaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-inject-phase
      Description: Publishes one phase of deliveries to SQS with SendMessageBatch.
      Handler: handlers.workflow.inject_phase.handler
      Timeout: 60
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref WorkflowLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - DynamoDBReadPolicy: { TableName: !Ref ExperimentsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BatchesTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt DeliveriesQueue.QueueName }

  CheckDrainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-check-drain
      Handler: handlers.workflow.check_drain.handler
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref WorkflowLogGroup }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref RunsTable }
        - Statement:
            - Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource:
                - !GetAtt DeliveriesQueue.Arn
                - !GetAtt DeliveriesDeadLetterQueue.Arn

  EvaluateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-evaluate
      Description: Recomputes every count from DynamoDB rows and decides the verdict.
      Handler: handlers.workflow.evaluate.handler
      MemorySize: 512
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref WorkflowLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BatchesTable }
        - DynamoDBReadPolicy: { TableName: !Ref LedgerTable }
        - DynamoDBReadPolicy: { TableName: !Ref DeliveriesTable }

  GenerateReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-generate-receipt
      Handler: handlers.workflow.generate_receipt.handler
      MemorySize: 512
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref WorkflowLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BatchesTable }
        - DynamoDBReadPolicy: { TableName: !Ref ExperimentsTable }
        - DynamoDBReadPolicy: { TableName: !Ref LedgerTable }
        - DynamoDBReadPolicy: { TableName: !Ref DeliveriesTable }
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${ReceiptsBucket.Arn}/receipts/*

  MarkFailedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-mark-failed
      Handler: handlers.workflow.mark_failed.handler
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref WorkflowLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - Statement:
            - Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource:
                - !GetAtt DeliveriesQueue.Arn
                - !GetAtt DeliveriesDeadLetterQueue.Arn

  RunWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub disburseproof-${Env}-run-workflow
      Type: STANDARD
      DefinitionUri: statemachine/run_workflow.asl.json
      DefinitionSubstitutions:
        InitRunFunctionArn: !GetAtt InitRunFunction.Arn
        InjectPhaseFunctionArn: !GetAtt InjectPhaseFunction.Arn
        CheckDrainFunctionArn: !GetAtt CheckDrainFunction.Arn
        EvaluateFunctionArn: !GetAtt EvaluateFunction.Arn
        GenerateReceiptFunctionArn: !GetAtt GenerateReceiptFunction.Arn
        MarkFailedFunctionArn: !GetAtt MarkFailedFunction.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref InitRunFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref InjectPhaseFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref CheckDrainFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref EvaluateFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref GenerateReceiptFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref MarkFailedFunction }

  # ---------------------------------------------------------------------------
  # HTTP API. Public, no auth (single demo operator), throttled.
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub disburseproof-${Env}-api
      Description: DisburseProof public API (synthetic sandbox, no auth).
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://main.${WebApp.DefaultDomain}
          - http://localhost:5173
          - http://localhost:4173
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600

  BatchesApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-api-batches
      Handler: handlers.api.batches.handler
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref ApiLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BatchesTable }
        - DynamoDBReadPolicy: { TableName: !Ref ExperimentsTable }
      Events:
        CreateBatch: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /batches } }
        ListBatches: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /batches } }
        GetBatch: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/batches/{batch_id}" } }

  ExperimentsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-api-experiments
      Handler: handlers.api.experiments.handler
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref ApiLogGroup }
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref BatchesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ExperimentsTable }
      Events:
        CreateExperiment: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /experiments } }
        GetExperiment: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/experiments/{experiment_id}" } }

  RunsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-api-runs
      Handler: handlers.api.runs.handler
      MemorySize: 512
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref ApiLogGroup }
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref RunWorkflow
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RunsTable }
        - DynamoDBReadPolicy: { TableName: !Ref ExperimentsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BatchesTable }
        - DynamoDBReadPolicy: { TableName: !Ref LedgerTable }
        - DynamoDBReadPolicy: { TableName: !Ref DeliveriesTable }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt RunWorkflow.Name }
        - Statement:
            - Effect: Allow
              Action: states:ListExecutions
              Resource: !Ref RunWorkflow
      Events:
        StartRun: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /runs } }
        ListRuns: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /runs } }
        GetRun: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/runs/{run_id}" } }
        ListStudents: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/runs/{run_id}/students" } }
        GetStudent:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/runs/{run_id}/students/{beneficiary_id}" }
        GetOverview: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /overview } }

  ReceiptsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-api-receipts
      Description: Receipts and read-only AWS evidence (execution history, queue depth, log lines).
      Handler: handlers.api.receipts.handler
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref ApiLogGroup }
      Environment:
        Variables:
          WORKER_LOG_GROUP: !Ref WorkerLogGroup
          WORKFLOW_LOG_GROUP: !Ref WorkflowLogGroup
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref RunsTable }
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${ReceiptsBucket.Arn}/receipts/*
            - Effect: Allow
              Action: states:GetExecutionHistory
              Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:disburseproof-${Env}-run-workflow:*
            - Effect: Allow
              Action: sqs:GetQueueAttributes
              Resource:
                - !GetAtt DeliveriesQueue.Arn
                - !GetAtt DeliveriesDeadLetterQueue.Arn
            - Effect: Allow
              Action: logs:FilterLogEvents
              Resource:
                - !GetAtt WorkerLogGroup.Arn
                - !GetAtt WorkflowLogGroup.Arn
      Events:
        GetReceipt: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/runs/{run_id}/receipt" } }
        GetEvidence: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/runs/{run_id}/evidence" } }

  # ---------------------------------------------------------------------------
  # Demo seed: the golden batch and experiment exist as soon as the stack does.
  # ---------------------------------------------------------------------------
  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub disburseproof-${Env}-seed
      Handler: handlers.seed.handler
      Timeout: 60
      LoggingConfig: { LogFormat: Text, LogGroup: !Ref WorkflowLogGroup }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BatchesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ExperimentsTable }

  DemoSeed:
    Type: Custom::DemoSeed
    Properties:
      ServiceToken: !GetAtt SeedFunction.Arn
      ServiceTimeout: 120
      SeedVersion: "1" # bump to re-run the (idempotent) seed on the next deploy

  # ---------------------------------------------------------------------------
  # Amplify Hosting for the static frontend (manual zip deployments).
  # ---------------------------------------------------------------------------
  WebApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub disburseproof-${Env}
      Description: DisburseProof operations console (static Vite build).
      Platform: WEB
      CustomRules:
        # Single-page app: serve index.html for deep links like /runs/<id>.
        - Source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|jpeg|js|json|map|png|svg|txt|webp|woff|woff2|ttf)$)([^.]+$)/>"
          Target: /index.html
          Status: "200"

  WebBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt WebApp.AppId
      BranchName: main
      Stage: PRODUCTION
      EnableAutoBuild: false

Outputs:
  ApiUrl:
    Description: HTTP API base URL (VITE_API_URL for the frontend)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FrontendUrl:
    Description: Amplify Hosting URL (after scripts/deploy_frontend.py uploads the build)
    Value: !Sub https://main.${WebApp.DefaultDomain}
  AmplifyAppId:
    Value: !GetAtt WebApp.AppId
  StateMachineArn:
    Value: !Ref RunWorkflow
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  DeliveriesQueueUrl:
    Value: !Ref DeliveriesQueue
  DeliveriesDeadLetterQueueUrl:
    Value: !Ref DeliveriesDeadLetterQueue
  ReceiptsBucketName:
    Value: !Ref ReceiptsBucket
  RunsTableName:
    Value: !Ref RunsTable
  LedgerTableName:
    Value: !Ref LedgerTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
  DeliveriesTableName:
    Value: !Ref DeliveriesTable
  DemoBatchId:
    Value: !GetAtt DemoSeed.BatchId
  DemoExperimentId:
    Value: !GetAtt DemoSeed.ExperimentId
