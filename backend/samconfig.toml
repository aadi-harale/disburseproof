# AWS SAM CLI configuration. Credentials are never stored here: SAM uses your
# normal AWS CLI profile or environment variables.
version = 0.1

[default.global.parameters]
stack_name = "disburseproof-dev"
region = "ap-south-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
s3_prefix = "disburseproof-dev"
# Pinned explicitly: `sam deploy` otherwise reuses whatever values the stack had before.
parameter_overrides = "Env=\"dev\" MaxActiveRuns=\"3\" LogRetentionDays=\"7\""
tags = "project=\"disburseproof\" env=\"dev\""
